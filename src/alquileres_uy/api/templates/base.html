<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Estimador de alquileres para Montevideo, basado en el modelo alquileres-uy — {{ app_name }}" />
    <meta name="color-scheme" content="light" />
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <header class="site-header" role="banner">
      <div class="container header-row">
        <h1 class="brand">
          <span class="brand-mark" aria-hidden="true">₳</span>
          <span class="brand-text">alquileres-uy</span>
        </h1>
        <div
          class="status-indicator"
          id="status-indicator"
          role="status"
          aria-live="polite"
          aria-label="Estado de la API"
        >
          <span class="status-dot" data-state="unknown" aria-hidden="true"></span>
          <span class="status-label">Comprobando estado…</span>
        </div>
      </div>
    </header>
    <main id="main" class="container" role="main">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer" role="contentinfo">
      <div class="container footer-row">
        <div class="footer-primary">
          <span class="footer-brand">alquileres-uy</span>
          <span class="footer-tag">Estimaciones basadas en un modelo entrenado sobre publicaciones públicas.</span>
        </div>
        <div class="footer-secondary">
          <span class="footer-version">API v{{ app_version }}</span>
          <a class="footer-link" href="{{ repository_url }}" target="_blank" rel="noopener noreferrer">
            Código en GitHub
          </a>
        </div>
      </div>
    </footer>
    <script src="/static/js/app.js" defer></script>
  </body>
</html>
