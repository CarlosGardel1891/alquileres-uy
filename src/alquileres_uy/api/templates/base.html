<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Estimación de precios de alquiler para Montevideo — {{ app_name }}" />
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <header class="site-header">
      <div class="container header-row">
        <h1 class="brand">alquileres-uy</h1>
        <div class="status-indicator" id="status-indicator" role="status" aria-live="polite">
          <span class="status-dot" data-state="unknown" aria-hidden="true"></span>
          <span class="status-label">Comprobando…</span>
        </div>
      </div>
    </header>
    <main id="main" class="container">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <div class="container footer-row">
        <span>API v{{ app_version }}</span>
        <a href="{{ repository_url }}" target="_blank" rel="noopener noreferrer">
          Repositorio en GitHub
        </a>
      </div>
    </footer>
    <script src="/static/js/app.js" defer></script>
  </body>
</html>
