[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alquileres-uy"
version = "0.1.0"
description = "Pipeline end-to-end para análisis y predicción de alquileres en Montevideo."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Martin Castaldi" }
]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config"
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF"
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["alquileres_uy"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
