[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alquileres-uy"
version = "0.1.0"
description = "Pipeline end-to-end para análisis y predicción de alquileres en Montevideo."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Martin Castaldi" }
]
dependencies = []

[project.optional-dependencies]
ingest = [
    "requests==2.32.3"
]
etl = [
    "pandas==2.2.3",
    "pyarrow==18.1.0",
    "pandera==0.22.1"
]
train = [
    "numpy==2.2.1",
    "pandas==2.2.3",
    "pyarrow==18.1.0",
    "scikit-learn==1.6.0",
    "lightgbm==4.5.0",
    "joblib==1.4.2",
    "matplotlib==3.10.0"
]
api = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "jinja2==3.1.5",
    "pydantic-settings==2.7.1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config"
]
markers = [
    "torch: tests that require the PyTorch CPU wheel (skip when torch is not installed)"
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF"
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["alquileres_uy"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
