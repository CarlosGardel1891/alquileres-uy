name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-and-classical:
    name: Quality + classical models
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-ingest.txt
            requirements-etl.txt
            requirements-train.txt
            requirements-api.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Install ingestion dependencies
        run: pip install -r requirements-ingest.txt

      - name: Install ETL dependencies
        run: pip install -r requirements-etl.txt

      - name: Install training dependencies
        run: pip install -r requirements-train.txt

      - name: Install API dependencies
        run: pip install -r requirements-api.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest (classical, skip torch)
        run: pytest -q -m "not torch"

      - name: Build package
        run: python -m build

      - name: Generate synthetic model fixture
        run: python scripts/_generate_model_fixture.py

      - name: Smoke — classical training (fixture mode)
        run: |
          python scripts/train_models.py \
            --fixture-mode \
            --etl-run-dir tests/fixtures/models/etl_run \
            --output-dir artifacts/ci-classical \
            --seed 42

      - name: Upload classical training artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-run-classical
          path: artifacts/ci-classical

  pytorch-cpu:
    name: PyTorch CPU
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-ingest.txt
            requirements-etl.txt
            requirements-train.txt
            requirements-api.txt
            requirements-torch-cpu.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Install ingestion dependencies
        run: pip install -r requirements-ingest.txt

      - name: Install ETL dependencies
        run: pip install -r requirements-etl.txt

      - name: Install training dependencies
        run: pip install -r requirements-train.txt

      - name: Install API dependencies
        run: pip install -r requirements-api.txt

      - name: Install PyTorch CPU wheels
        run: pip install -r requirements-torch-cpu.txt

      - name: Pytest (torch marker only)
        run: pytest -q -m torch

      - name: Generate synthetic model fixture
        run: python scripts/_generate_model_fixture.py

      - name: Smoke — full training with --include-torch
        run: |
          python scripts/train_models.py \
            --fixture-mode \
            --etl-run-dir tests/fixtures/models/etl_run \
            --output-dir artifacts/ci-torch \
            --include-torch \
            --seed 42

      - name: Upload torch training artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-run-torch
          path: artifacts/ci-torch

  docker-build:
    name: Docker image build (no push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare an empty serving-bundle placeholder
        run: |
          mkdir -p artifacts/models/.placeholder
          echo "The real bundle is copied at deploy time via a volume mount." \
            > artifacts/models/.placeholder/README.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (do not push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: alquileres-uy-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-check:
    name: Release readiness check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build
          pip install -r requirements-dev.txt

      - name: Resolve current package version
        id: version
        run: |
          VERSION="$(PYTHONPATH=src python -c 'from alquileres_uy._version import __version__; print(__version__)')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "package version = ${VERSION}"

      - name: CHANGELOG entry exists for current version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section" >&2
            exit 1
          fi
          echo "found '## [${VERSION}]' in CHANGELOG.md"

      - name: pyproject dynamic version matches package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILT_VERSION="$(PYTHONPATH=src python -c 'from importlib.metadata import version; print(version(\"alquileres-uy\"))' 2>/dev/null || echo skip)"
          if [ "${BUILT_VERSION}" != "skip" ] && [ "${BUILT_VERSION}" != "${VERSION}" ]; then
            echo "::error::installed metadata version (${BUILT_VERSION}) != _version (${VERSION})" >&2
            exit 1
          fi

      - name: Regenerate build_info.json
        run: |
          python scripts/generate_build_info.py --print
          test -s src/alquileres_uy/build_info.json

      - name: Build wheel + sdist
        run: python -m build

      - name: Wheel + sdist contain the current version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ls dist
          test -f "dist/alquileres_uy-${VERSION}-py3-none-any.whl" || \
            test -f "dist/alquileres_uy-${VERSION}.tar.gz"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare empty serving-bundle placeholder
        run: |
          mkdir -p artifacts/models/.placeholder
          echo "release-check image — no bundle" \
            > artifacts/models/.placeholder/README.txt

      - name: Docker build with version arg (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: alquileres-uy-api:release-check
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify OCI labels on built image
        run: |
          docker inspect alquileres-uy-api:release-check \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}' \
            | tee labels.txt
          grep -qx "${{ steps.version.outputs.version }}" labels.txt
